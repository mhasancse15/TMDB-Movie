name: movie_verse
description: "MovieVerse - Premium Movie & TV discovery app built with Clean Architecture, Riverpod, Drift, and Dio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Navigation
  go_router: ^14.0.0

  # Serialization
  json_annotation: ^4.9.0

  # Local Storage & Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Environment & Utilities
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  equatable: ^2.0.5

  # Media & UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  youtube_player_iframe: ^5.2.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - .env
